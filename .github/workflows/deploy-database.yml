name: Deploy Database

# develop → development Supabase
# main    → production Supabase

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Apply development migrations
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEVELOPMENT_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEVELOPMENT_SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "DEVELOPMENT_SUPABASE_DB_PASSWORD is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "DEVELOPMENT_SUPABASE_PROJECT_ID is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing development secrets, then re-run this workflow."
            exit 1
          fi
          echo "Deploying migrations to the development database."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push

  deploy-production:
    name: Apply production migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "SUPABASE_PROJECT_ID is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing production secrets, then re-run this workflow."
            exit 1
          fi
          echo "Deploying migrations to the production database."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push
