name: Deploy Engine

# develop → tbp-engine-dev (development Supabase only)
# main    → tbp-engine (production Supabase only)
# Create the Fly apps and set FLY_API_TOKEN plus Fly secrets before this job succeeds.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy development engine
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set on the development environment."
            echo "Create tbp-engine-dev in Sydney, then add the token."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.development.toml --remote-only

  deploy-production:
    name: Deploy production engine
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set on the production environment."
            echo "Create tbp-engine in Sydney, then add the token."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.production.toml --remote-only
