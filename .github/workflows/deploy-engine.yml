name: Deploy Engine

# develop → tbp-engine-dev (development Supabase only)
# main    → tbp-engine (production Supabase only)
# Create the Fly apps and set FLY_API_TOKEN plus Fly secrets before this job succeeds.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy development engine
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set on the development environment."
            echo "Create an org token in Fly (Tokens on the org, not Launch from GitHub)."
            echo "Add it as FLY_API_TOKEN on GitHub Environment development."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure development app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG_OVERRIDE: ${{ vars.FLY_ORG }}
        run: |
          if flyctl status --app tbp-engine-dev >/dev/null 2>&1; then
            echo "tbp-engine-dev already exists"
            exit 0
          fi
          if [ -n "$FLY_ORG_OVERRIDE" ]; then
            org="$FLY_ORG_OVERRIDE"
            echo "using FLY_ORG: $org"
          else
            org="$(flyctl orgs list --json | jq -r '
              if type == "array" then (.[0].Slug // .[0].slug // empty)
              else (keys | .[0]) // empty
              end
            ')"
            if [ -z "$org" ] || [ "$org" = "null" ]; then
              echo "Could not detect the Fly org from this token."
              echo "In GitHub repo Settings → Environments → development, add variable FLY_ORG (the org slug from the Fly dashboard)."
              exit 1
            fi
            echo "detected Fly org: $org"
          fi
          flyctl apps create tbp-engine-dev --org "$org" --yes

      - name: Check Fly app secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          secrets="$(flyctl secrets list --app tbp-engine-dev --json)"
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY EXCHANGE_CREDENTIALS_KEY; do
            if ! echo "$secrets" | grep -q "\"Name\":\"$name\""; then
              echo "tbp-engine-dev exists, but $name is not set on the Fly app."
              echo "In Fly, open tbp-engine-dev → Secrets and add the three development values from Vercel Development."
              echo "Then re-run this workflow. Do not use Launch from GitHub."
              exit 1
            fi
          done

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.development.toml --remote-only

  deploy-production:
    name: Deploy production engine
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set on the production environment."
            echo "Create tbp-engine in Sydney, then add the token."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.production.toml --remote-only
