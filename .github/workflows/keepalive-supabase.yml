name: Keepalive Supabase

# Ping develop and production Postgres so free-tier projects are less likely
# to pause during inactivity. Does not apply migrations.

on:
  schedule:
    # Every 3 days at 12:00 UTC
    - cron: "0 12 */3 * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive-development:
    name: Keep development alive
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEVELOPMENT_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEVELOPMENT_SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "DEVELOPMENT_SUPABASE_DB_PASSWORD is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "DEVELOPMENT_SUPABASE_PROJECT_ID is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing development secrets, then re-run this workflow."
            exit 1
          fi
          echo "Pinging the development database."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Ping database
        run: |
          supabase db query --linked "select 1 as keepalive from public.system_health limit 1"

  keepalive-production:
    name: Keep production alive
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not set"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "SUPABASE_PROJECT_ID is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing production secrets, then re-run this workflow."
            exit 1
          fi
          echo "Pinging the production database."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Ping database
        run: |
          supabase db query --linked "select 1 as keepalive from public.system_health limit 1"
