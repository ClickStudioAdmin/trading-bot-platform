# Long backtests (production). Same image as the desk worker, different process.
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EXCHANGE_CREDENTIALS_KEY.
# Production Supabase only. The billing key stays on tbp-engine.

app = "tbp-backtest"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  TBP_ENGINE_WORKER = "1"
  TBP_BACKTEST_WORKER = "1"
  # Leave headroom for native buffers on the 8 GB machine.
  NODE_OPTIONS = "--max-old-space-size=6144"

[processes]
  app = "./node_modules/.bin/tsx lib/engine/backtest-worker.ts"

[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "performance-1x"
  memory = "8192mb"
  cpus = 1
