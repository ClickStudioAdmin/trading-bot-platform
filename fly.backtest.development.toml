# Long backtests (development). Same image as the desk worker, different process.
# GitHub Actions creates tbp-backtest-dev when FLY_API_TOKEN is set.
# Secrets match tbp-engine-dev: development Supabase only.

app = "tbp-backtest-dev"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  TBP_ENGINE_WORKER = "1"
  TBP_BACKTEST_WORKER = "1"

[processes]
  app = "./node_modules/.bin/tsx lib/engine/backtest-worker.ts"

[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
