# Trading Bot Platform engine worker (production).
# Create: fly apps create tbp-engine --region syd
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EXCHANGE_CREDENTIALS_KEY
# (production Supabase only)

app = "tbp-engine"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  TBP_ENGINE_WORKER = "1"
  ENGINE_LOOP_MS = "20000"

[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
